
name: Binance Square Quality Post Drafts

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"
    - cron: "30 14 * * *"
    - cron: "30 20 * * *"

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate researched post draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > generate.mjs <<'EOF'
          const key = process.env.GEMINI_API_KEY;
          if (!key) throw new Error("GEMINI_API_KEY is missing");

          // Public 24-hour market statistics, not a trading signal.
          const symbols = ["BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT", "SUIUSDT"];
          const url =
            "https://api.binance.com/api/v3/ticker/24hr?symbols=" +
            encodeURIComponent(JSON.stringify(symbols));

          const marketRes = await fetch(url);
          if (!marketRes.ok) {
            throw new Error("Market data unavailable: " + marketRes.status);
          }

          const raw = await marketRes.json();
          const market = raw.map(x => ({
            symbol: x.symbol,
            price: x.lastPrice,
            change24hPercent: x.priceChangePercent,
            high24h: x.highPrice,
            low24h: x.lowPrice,
            quoteVolume24h: x.quoteVolume
          }));

          const hour = new Date().getUTCHours();
          const styles = [
            {
              title: "Market structure",
              instruction:
                "Explain the 24-hour market picture and important uncertainty."
            },
            {
              title: "Coin comparison",
              instruction:
                "Compare two coins using the supplied data. Avoid unsupported claims."
            },
            {
              title: "Trader education",
              instruction:
                "Teach one useful risk-management lesson using the supplied data."
            }
          ];

          const slot = hour < 12 ? 0 : hour < 18 ? 1 : 2;
          const style = styles[slot];

          const prompt = `
          You are a careful crypto market research writer for Binance Square.

          Create ONE original, useful post draft in English.
          Topic: ${style.title}
          Approach: ${style.instruction}

          Verified market data (24-hour statistics):
          ${JSON.stringify(market)}

          Requirements:
          - 500 to 750 characters.
          - Use at most 3 relevant coin cashtags.
          - Include specific supplied figures where useful.
          - Explain what the data does and does not show.
          - Never invent news, support/resistance levels, indicators,
            order-book information, chart patterns, or future prices.
          - No guaranteed profits, "100% win rate", or pressure to trade.
          - Do not tell readers to buy or sell.
          - Include a concise risk disclaimer.
          - Make this post distinct and useful, not generic hype.
          - Output only the finished draft.
          `;

          const endpoint =
            "https://generativelanguage.googleapis.com/v1beta/models/" +
            "gemini-2.5-flash:generateContent?key=" +
            encodeURIComponent(key);

          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: {
                temperature: 0.65,
                maxOutputTokens: 500
              }
            })
          });

          if (!response.ok) {
            throw new Error(
              "Gemini failed: " + response.status + " " +
              (await response.text())
            );
          }

          const data = await response.json();
          const draft =
            data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();

          if (!draft) throw new Error("No draft returned");

          console.log("=== REVIEW BEFORE MANUAL PUBLICATION ===");
          console.log("Draft category:", style.title);
          console.log("Market data timestamp (UTC):", new Date().toISOString());
          console.log("=== POST DRAFT ===");
          console.log(draft);
          EOF

          node generate.mjs
