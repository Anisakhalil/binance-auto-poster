
name: Binance Square AI Auto Poster

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"

permissions:
  contents: read

concurrency:
  group: binance-square-auto-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate AI crypto post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const apiKey = process.env.GEMINI_API_KEY;
          if (!apiKey) throw new Error("GEMINI_API_KEY secret is missing.");

          const symbols = ["BTCUSDT", "ETHUSDT", "BNBUSDT"];
          const market = [];

          for (const symbol of symbols) {
            const url = new URL(
              "https://api.binance.com/api/v3/ticker/24hr"
            );
            url.searchParams.set("symbol", symbol);

            const response = await fetch(url);
            if (!response.ok) {
              throw new Error(`Market data failed for ${symbol}: ${response.status}`);
            }

            const d = await response.json();
            market.push({
              symbol,
              price: d.lastPrice,
              change24h: d.priceChangePercent,
              high24h: d.highPrice,
              low24h: d.lowPrice
            });
          }

          const prompt = `
          Write ONE original, useful Binance Square crypto market post in English.
          Use the following live 24-hour market data:
          ${JSON.stringify(market, null, 2)}

          Requirements:
          - 120 to 220 words maximum.
          - Explain market context, not guaranteed future price movement.
          - Use accurate numbers only from the supplied data.
          - Include BTC, ETH and BNB where relevant.
          - Add a short educational risk reminder.
          - No fabricated news, unsupported claims, or guaranteed returns.
          - No personalized financial advice.
          - Use a few relevant hashtags.
          - Output only the post text, with no title like "Here is your post".
          `;

          const response = await fetch(
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": apiKey
              },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                  temperature: 0.7,
                  maxOutputTokens: 500
                }
              })
            }
          );

          if (!response.ok) {
            throw new Error(`Gemini API failed: ${response.status} ${await response.text()}`);
          }

          const data = await response.json();
          const post = data.candidates?.[0]?.content?.parts
            ?.map(part => part.text || "")
            .join("")
            .trim();

          if (!post || post.length < 40) {
            throw new Error("Gemini returned an empty or too-short post.");
          }

          fs.writeFileSync("post.txt", post + "\n", "utf8");
          console.log("AI post generated successfully.");
          console.log(post);
          NODE

      - name: Get official Binance Square posting script
        run: |
          git clone --depth 1 \
            https://github.com/binance/binance-skills-hub.git \
            "$RUNNER_TEMP/binance-skills-hub"

          test -f \
            "$RUNNER_TEMP/binance-skills-hub/skills/binance/square-post/scripts/post-text.mjs"

      - name: Publish text post to Binance Square
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          if [ -z "$BINANCE_SQUARE_OPENAPI_KEY" ]; then
            echo "Missing BINANCE_SQUARE_OPENAPI_KEY secret."
            exit 1
          fi

          node \
            "$RUNNER_TEMP/binance-skills-hub/skills/binance/square-post/scripts/post-text.mjs" \
            --text "$(cat post.txt)"
