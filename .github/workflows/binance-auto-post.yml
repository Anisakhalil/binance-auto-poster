
name: Binance Square Auto Poster

on:
  workflow_dispatch:
    inputs:
      post_mode:
        description: "Draft ya live post"
        required: true
        type: choice
        options:
          - draft
          - live
        default: draft
  schedule:
    - cron: "0 6,10,14,18 * * *"

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GEMINI_MODEL: gemini-3.8-flash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Generate market post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p out

          python - <<'PY'
          import os
          import sys
          import requests

          def fail(message):
              print("ERROR:", message)
              sys.exit(1)

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          model = os.environ.get(
              "GEMINI_MODEL", "gemini-3.8-flash"
          )

          if not key:
              fail("GEMINI_API_KEY secret is missing.")

          url = (
              "https://api.coingecko.com/api/v3/coins/markets"
          )
          params = {
              "vs_currency": "usd",
              "ids": "bitcoin,ethereum,binancecoin,solana",
              "price_change_percentage": "24h"
          }

          try:
              response = requests.get(
                  url, params=params, timeout=25
              )
              response.raise_for_status()
              coins = response.json()
          except Exception as e:
              fail("CoinGecko market request failed: " + str(e))

          if not isinstance(coins, list) or len(coins) < 3:
              fail("Market data is incomplete.")

          rows = []
          for coin in coins:
              price = coin.get("current_price")
              change = coin.get("price_change_percentage_24h")
              volume = coin.get("total_volume")

              if price is None or change is None:
                  continue

              rows.append(
                  f"{coin.get('name')} ({coin.get('symbol', '').upper()}): "
                  f"price=${price}, 24h change={change:.2f}%, "
                  f"volume=${volume}"
              )

          if len(rows) < 3:
              fail("Not enough valid market data.")

          market = "\n".join(rows)

          prompt = f"""
          Write one original Binance Square crypto market analysis
          in English, approximately 600-900 characters.

          Use the market data below accurately. Explain the market
          mood, compare the listed assets, and mention what traders
          should watch next. Include balanced risk management advice.
          Do not invent prices, news, indicators, or guarantees.
          Do not promise profits. Use a clear title, short paragraphs,
          and 3-5 relevant hashtags. Return only the post text.

          MARKET DATA:
          {market}
          """

          api_url = (
              "https://generativelanguage.googleapis.com/"
              f"v1beta/models/{model}:generateContent"
          )

          try:
              response = requests.post(
                  api_url,
                  headers={
                      "x-goog-api-key": key,
                      "Content-Type": "application/json"
                  },
                  json={
                      "contents": [{
                          "parts": [{"text": prompt}]
                      }],
                      "generationConfig": {
                          "temperature": 0.7,
                          "maxOutputTokens": 700
                      }
                  },
                  timeout=60
              )

              if not response.ok:
                  fail(
                      f"Gemini API HTTP {response.status_code}: "
                      + response.text[:1200]
                  )

              data = response.json()
              text = data["candidates"][0]["content"]["parts"][0]["text"].strip()

          except SystemExit:
              raise
          except Exception as e:
              fail("Gemini generation failed: " + str(e))

          if len(text) < 200 or len(text) > 2000:
              fail(
                  f"Generated post length invalid: {len(text)} characters."
              )

          with open("out/post.txt", "w", encoding="utf-8") as f:
              f.write(text)

          with open("out/market-data.txt", "w", encoding="utf-8") as f:
              f.write(market)

          print("Post generated successfully.")
          print("Character count:", len(text))
          print(text)
          PY

      - name: Publish to Binance Square
        if: ${{ (github.event_name == 'schedule' || inputs.post_mode == 'live') }}
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          key = os.environ.get(
              "BINANCE_SQUARE_OPENAPI_KEY", ""
          ).strip()

          if not key:
              sys.exit(
                  "BINANCE_SQUARE_OPENAPI_KEY secret is missing."
              )

          with open("out/post.txt", encoding="utf-8") as f:
              post_text = f.read().strip()

          url = (
              "https://www.binance.com/bapi/composite/v1/"
              "public/pgc/openApi/content/add"
          )

          try:
              response = requests.post(
                  url,
                  headers={
                      "Content-Type": "application/json",
                      "clienttype": "binanceSkill",
                      "X-Square-OpenAPI-Key": key
                  },
                  json={"bodyTextOnly": post_text},
                  timeout=30
              )

              print("Binance HTTP status:", response.status_code)
              response.raise_for_status()
              result = response.json()

          except Exception as e:
              sys.exit("Binance publishing request failed: " + str(e))

          if str(result.get("code")) != "000000":
              sys.exit(
                  "Binance rejected the post: "
                  + str(result)[:1500]
              )

          print("Binance Square accepted the post.")
          print("Response:", result)
          PY

      - name: Save generated post artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-binance-post
          path: out/
          if-no-files-found: warn
          retention-days: 7
