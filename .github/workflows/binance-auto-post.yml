---
name: Binance Square Auto Post

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"
    - cron: "30 11 * * *"
    - cron: "30 14 * * *"
    - cron: "30 17 * * *"
    - cron: "30 20 * * *"
    - cron: "0 23 * * *"

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Binance Square post with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          node --version
          cat > generate.mjs <<'EOF'
          const geminiKey = process.env.GEMINI_API_KEY;
          const squareKey = process.env.BINANCE_SQUARE_OPENAPI_KEY;

          if (!geminiKey) throw new Error("GEMINI_API_KEY secret missing");
          if (!squareKey) throw new Error("BINANCE_SQUARE_OPENAPI_KEY secret missing");

          const prompt = `You are a Binance Square crypto market commentator.
          Write ONE short market insight post (under 280 chars) for retail crypto traders.
          Focus: factual, neutral, no financial advice.
          Pick one of: BTC, ETH, BNB, SOL. Use 1-3 hashtags only.`;

          const geminiUrl =
            "https://generativelanguage.googleapis.com/v1beta/" +
            "models/gemini-3.8-flash:generateContent?key=" +
            encodeURIComponent(geminiKey);

          const geminiRes = await fetch(geminiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.7, maxOutputTokens: 256 },
            }),
          });

          if (!geminiRes.ok) {
            throw new Error("Gemini API failed: " + geminiRes.status +
              " " + (await geminiRes.text()));
          }
          const geminiData = await geminiRes.json();
          const content =
            geminiData?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();

          if (!content) {
            throw new Error("Gemini returned empty content: " +
              JSON.stringify(geminiData));
          }

          console.log("=== Generated post ===");
          console.log(content);

          const squareUrl =
            "https://www.binance.com/bapi/composite/v1/public/pgc/" +
            "openApi/content/add";
          const squareRes = await fetch(squareUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Square-OpenAPI-Key": squareKey,
            },
            body: JSON.stringify({ bodyTextOnly: content }),
          });

          if (!squareRes.ok) {
            throw new Error("Binance Square post failed: " +
              squareRes.status + " " + (await squareRes.text()));
          }
          console.log("=== Binance Square response ===");
          console.log(await squareRes.text());
          EOF
          node generate.mjs
