
name: Binance Square Analyst Posts

on:
  workflow_dispatch:
    inputs:
      post_mode:
        description: "draft = save only, live = publish"
        type: choice
        options:
          - draft
          - live
        default: draft
      max_delay_min:
        description: "Maximum random delay in minutes"
        type: string
        default: "5"

  schedule:
    - cron: "0 6 * * *"
    - cron: "0 10 * * *"
    - cron: "0 14 * * *"
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: square-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install requests

      - name: Get official Binance Square publisher
        run: |
          git clone --depth 1 \
            https://github.com/binance/binance-skills-hub.git \
            /tmp/binance-skills-hub

      - name: Generate original market analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          mkdir -p out

          python - <<'PY'
          import os, json, sys, requests

          api = "https://data-api.binance.vision/api/v3"
          r = requests.get(api + "/ticker/24hr", timeout=25)
          r.raise_for_status()
          tickers = {x["symbol"]: x for x in r.json()}

          coins = ["BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT"]
          lines = []

          for symbol in coins:
              t = tickers.get(symbol)
              if not t:
                  continue
              lines.append(
                  f"{symbol}: price={t['lastPrice']}, "
                  f"24h_change={t['priceChangePercent']}%, "
                  f"24h_quote_volume={t['quoteVolume']} USDT"
              )

          if len(lines) < 3:
              sys.exit("Not enough market data; refusing to invent data.")

          market = "\n".join(lines)
          key = os.environ.get("GEMINI_API_KEY", "").strip()

          if not key:
              sys.exit("GEMINI_API_KEY secret is missing.")

          prompt = f"""
          Write ONE original Binance Square crypto education post.
          Use only the live data below. Do not invent prices or events.

          LIVE DATA:
          {market}

          Requirements:
          - Write in natural, readable English.
          - Around 600-1000 characters.
          - Start with an interesting, accurate market observation.
          - Explain what the data suggests and what it cannot prove.
          - Include BTC and at least one other coin.
          - Give readers one practical risk-management lesson.
          - End with a genuine question for discussion.
          - Add 2-4 relevant hashtags.
          - Clearly state: Educational content, not financial advice.
          - No guaranteed profit, fake news, fabricated statistics,
            repetitive filler, or personalized trade instructions.
          - Return only the post text, without quotation marks.
          """

          model = os.environ.get("GEMINI_MODEL", "gemini-2.5-flash")
          url = (
              "https://generativelanguage.googleapis.com/v1beta/models/"
              + model + ":generateContent"
          )

          response = requests.post(
              url,
              params={"key": key},
              json={
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {
                      "temperature": 0.8,
                      "maxOutputTokens": 700
                  }
              },
              timeout=60
          )
          response.raise_for_status()
          data = response.json()

          try:
              text = data["candidates"][0]["content"]["parts"][0]["text"].strip()
          except (KeyError, IndexError, TypeError):
              sys.exit("Gemini returned no usable post.")

          if len(text) < 200 or len(text) > 2000:
              sys.exit("Post length invalid; refusing to publish.")

          os.makedirs("out", exist_ok=True)
          with open("out/post.txt", "w", encoding="utf-8") as f:
              f.write(text)

          with open("out/market-data.txt", "w", encoding="utf-8") as f:
              f.write(market)

          print("Post generated. Characters:", len(text))
          print(text)
          PY

      - name: Publish or save draft
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          POST_MODE: ${{ github.event.inputs.post_mode || 'live' }}
          MAX_DELAY_MIN: ${{ github.event.inputs.max_delay_min || '5' }}
        run: |
          set -euo pipefail

          MODE="$POST_MODE"
          if [ "$MODE" != "draft" ] && [ "$MODE" != "live" ]; then
            echo "Invalid post mode."
            exit 1
          fi

          if [ "$MODE" = "draft" ]; then
            echo "Draft saved. No post was published."
            exit 0
          fi

          if [ -z "${BINANCE_SQUARE_OPENAPI_KEY:-}" ]; then
            echo "ERROR: Binance Square API key secret is missing."
            exit 1
          fi

          DELAY="${MAX_DELAY_MIN:-5}"
          if ! [[ "$DELAY" =~ ^[0-9]+$ ]] || [ "$DELAY" -gt 30 ]; then
            echo "Delay must be a number from 0 to 30."
            exit 1
          fi

          if [ "$DELAY" -gt 0 ]; then
            python -c "import random,time; time.sleep(random.randint(0,$DELAY)*60)"
          fi

          cd /tmp/binance-skills-hub/skills/binance/square-post

          node scripts/post-text.mjs \
            --text "$(cat "$GITHUB_WORKSPACE/out/post.txt)"

      - name: Upload generated post
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: square-post-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
