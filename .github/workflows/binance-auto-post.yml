
name: Binance Square Auto Post

on:
  workflow_dispatch:
    inputs:
      post_mode:
        description: "Choose draft or live"
        required: true
        type: choice
        options:
          - draft
          - live
        default: draft
  schedule:
    - cron: "0 6,10,14,17 * * *"

permissions:
  contents: read

concurrency:
  group: square-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
      POST_MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.post_mode || 'draft' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Create and publish post
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from pathlib import Path

          gemini_key = os.environ.get("GEMINI_API_KEY", "")
          square_key = os.environ.get(
              "BINANCE_SQUARE_OPENAPI_KEY", ""
          )
          mode = os.environ.get("POST_MODE", "draft").lower()

          if not gemini_key:
              raise SystemExit("Missing GEMINI_API_KEY secret")

          prices = []
          for symbol in ["BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT"]:
              r = requests.get(
                  "https://api.binance.com/api/v3/ticker/24hr",
                  params={"symbol": symbol},
                  timeout=20
              )
              r.raise_for_status()
              d = r.json()
              prices.append(
                  f"{symbol}: price={d['lastPrice']}, "
                  f"24h change={d['priceChangePercent']}%"
              )

          market = "\n".join(prices)
          prompt = f"""
          Write one concise, original English Binance Square
          crypto market analysis post using this live market data.

          {market}

          Explain the observed market moves without inventing
          support/resistance levels or predicting guaranteed profits.
          Keep it under 900 characters. Include a brief educational
          disclaimer. Output only the post text.
          """

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-2.5-flash:generateContent"
          )
          r = requests.post(
              url,
              params={"key": gemini_key},
              json={"contents": [{"parts": [{"text": prompt}]}]},
              timeout=60
          )
          r.raise_for_status()
          data = r.json()
          post = data["candidates"][0]["content"]["parts"][0]["text"].strip()

          if not post:
              raise SystemExit("Gemini returned an empty post")

          Path("out").mkdir(exist_ok=True)
          Path("out/draft.txt").write_text(post, encoding="utf-8")

          print("Generated post:\n" + post)
          print("Selected mode:", mode)

          if mode == "draft":
              print("Draft saved to out/draft.txt; not published.")
          elif mode == "live":
              if not square_key:
                  raise SystemExit(
                      "Missing BINANCE_SQUARE_OPENAPI_KEY secret"
                  )

              r = requests.post(
                  "https://www.binance.com/bapi/composite/v1/public/pgc/openApi/content/add",
                  headers={
                      "X-Square-OpenAPI-Key": square_key,
                      "Content-Type": "application/json",
                      "clienttype": "binanceSkill"
                  },
                  json={"bodyTextOnly": post},
                  timeout=30
              )
              r.raise_for_status()
              result = r.json()

              if result.get("code") != "000000":
                  raise SystemExit(
                      "Binance rejected post: "
                      + str(result.get("code"))
                      + " "
                      + str(result.get("message"))
                  )

              post_id = result.get("data", {}).get("id")
              if post_id:
                  print(
                      "POST PUBLISHED: "
                      + "https://www.binance.com/square/post/"
                      + str(post_id)
                  )
              else:
                  print("API reported success; post ID unavailable.")
          else:
              raise SystemExit("Invalid POST_MODE")
          PY

      - name: Save draft artifact
        if: success() && (github.event_name == 'workflow_dispatch' && inputs.post_mode == 'draft')
        uses: actions/upload-artifact@v4
        with:
          name: binance-square-draft
          path: out/draft.txt
          if-no-files-found: error
