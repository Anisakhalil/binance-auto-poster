name: Binance Square Auto Post

on:
  workflow_dispatch:

  schedule:
    - cron: "30 3 * * *"
    - cron: "30 6 * * *"
    - cron: "30 9 * * *"
    - cron: "30 12 * * *"
    - cron: "30 15 * * *"
    - cron: "0 18 * * *"

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Binance Square post with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > generate.mjs <<'EOF'
          const key = process.env.GEMINI_API_KEY;

          const prompt = `
          Write ONE short, engaging Binance Square post about cryptocurrency.

          Requirements:
          - English language
          - 500 characters maximum
          - Educational and realistic
          - No guaranteed profits
          - No fake news or invented prices
          - Do not give financial advice
          - Use 2 or 3 relevant hashtags
          - Make it natural and attractive for Binance Square
          - Return ONLY the post text
          `;

          const response = await fetch(
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": key
              },
              body: JSON.stringify({
                contents: [
                  {
                    parts: [{ text: prompt }]
                  }
                ]
              })
            }
          );

          if (!response.ok) {
            throw new Error(await response.text());
          }

          const data = await response.json();
          const text =
            data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();

          if (!text) {
            throw new Error("Gemini returned no post text.");
          }

          console.log(text);
          await import("node:fs/promises").then(fs =>
            fs.writeFile(".square-post.txt", text)
          );
          EOF

          node generate.mjs

      - name: Download Binance Square posting skill
        run: |
          git clone --depth 1 https://github.com/binance/binance-skills-hub.git /tmp/binance-skills

      - name: Publish to Binance Square
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          cd /tmp/binance-skills/skills/binance/square-post
          node scripts/post-text.mjs \
            --text "$(cat "$GITHUB_WORKSPACE/.square-post.txt")"
