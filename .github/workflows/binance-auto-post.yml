
name: Binance Square Quality Posts

on:
  schedule:
    # Pakistan time: 06:17, 14:17, 22:17
    - cron: "17 1 * * *"
    - cron: "17 9 * * *"
    - cron: "17 17 * * *"

  workflow_dispatch:
    inputs:
      slot:
        description: "1 = BTC market, 2 = trending coin, 3 = technical setup"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: read

concurrency:
  group: binance-square-quality-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      SLOT: ${{ inputs.slot || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests matplotlib

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download Binance Square posting skill
        run: |
          git clone --depth 1 \
            https://github.com/binance/binance-skills-hub.git \
            /tmp/binance-skills

          echo "Checking image posting script..."
          find /tmp/binance-skills \
            -path '*/post-image.mjs' -print

      - name: Validate required API secret
        run: |
          if [ -z "$BINANCE_SQUARE_OPENAPI_KEY" ]; then
            echo "::error::Missing BINANCE_SQUARE_OPENAPI_KEY secret"
            exit 1
          fi

      - name: Build analysis and publish post
        run: python bot.py

      - name: Save post and chart for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: square-post-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
