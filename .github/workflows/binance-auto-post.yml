name: Binance Square Direct Poster

on:
  workflow_dispatch:
    inputs:
      post_mode:
        description: "live = seedha Binance Square par post karo | draft = sirf files save karo"
        required: false
        default: "live"
        type: choice
        options:
          - live
          - draft

  schedule:
    - cron: "13 0 * * *"    # 00:13 UTC = 05:43 IST — Asia session open
    - cron: "11 8 * * *"    # 08:11 UTC = 13:41 IST — London session open
    - cron: "37 13 * * *"   # 13:37 UTC = 19:07 IST — London–NY overlap (sab se zyada volume)
    - cron: "53 16 * * *"   # 16:53 UTC = 22:23 IST — US session peak

permissions:
  contents: write

concurrency:
  group: binance-square-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt

      - name: Offline selftest (endpoint + payload check)
        run: python square_post.py --selftest

      - name: Direct post to Binance Square
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash"
          POST_MODE: ${{ github.event.inputs.post_mode || 'live' }}
          POST_IMAGE: "true"
          MAX_START_DELAY_MIN: "8"
          OUT_DIR: "out"
        run: python square_post.py

      - name: Show draft + result
        if: always()
        run: |
          echo "----- out/draft.md -----"
          cat out/draft.md 2>/dev/null || echo "(no draft)"
          echo "----- out/result.json -----"
          cat out/result.json 2>/dev/null || echo "(no result)"
          echo "----- files -----"
          ls -la out 2>/dev/null || true

      - name: Upload draft + chart artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: square-post-${{ github.run_number }}
          path: out/
          retention-days: 7
          if-no-files-found: warn

  # ============================================================================
  # KEEPALIVE — FIX: external action hata diya. Self-contained git push.
  # [skip ci] -> infinite loop nahi banega.
  # GitHub 60 din inactivity par scheduled workflows disable karta hai;
  # yeh empty commit har Monday push karke repo ko "active" rakhta hai.
  # ============================================================================
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Empty commit (60-day auto-disable se bachao)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: scheduled keepalive [skip ci]"
          git push
